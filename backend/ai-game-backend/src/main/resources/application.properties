spring.application.name=ai-game-backend

# --- Database 設定 (環境変数 SPRING_DATASOURCE_URL で本番DBへ切り替え可能 / デフォルトはファイル永続化H2) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aigamedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- H2 Webコンソール設定 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MyBatis & SQL初期化設定 ---
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# --- Gemini API 設定 (環境変数 GEMINI_API_KEY で上書き可能) ---
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6KDC6BYZJqOYo8wSym3WDMHpCkNNs5YeofkXmE6cr2iYg}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent


